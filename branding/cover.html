<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Baloo+Bhaijaan+2:wght@700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
  /* Discord Cover Art: 1024x576. Designed on a 1920x1080 stage and scaled down. */
  html, body { margin: 0; width: 1024px; height: 576px; overflow: hidden; background: #fff6e8; }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform: scale(0.533334); transform-origin: 0 0;
    background:
      radial-gradient(900px 620px at 8% 10%, rgba(255, 209, 102, 0.55), transparent 65%),
      radial-gradient(760px 560px at 96% 92%, rgba(255, 93, 143, 0.28), transparent 65%),
      #fff6e8;
    color: #3a1f00;
    font-family: Inter, sans-serif;
    display: flex; align-items: center; gap: 120px; padding: 0 150px; box-sizing: border-box;
  }
  .tiles { position: relative; width: 560px; height: 520px; flex: none; }
  .tile {
    position: absolute; display: grid; place-items: center; border-radius: 26%;
    font-family: "Baloo 2", sans-serif; font-weight: 800; line-height: 1; color: #fff;
  }
  .en { left: 0; top: 40px; width: 360px; height: 360px; font-size: 245px; background: #ff5d8f; box-shadow: 0 26px 0 #d63f6d; transform: rotate(-7deg); }
  .ar { left: 250px; top: 235px; width: 300px; height: 300px; font-size: 190px; background: #ff8a3d; box-shadow: 0 22px 0 #d96f24; transform: rotate(7deg); font-family: "Baloo Bhaijaan 2", sans-serif; }
  .ar span { transform: translateY(-16px); display: block; }
  h1 { margin: 0; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 108px; line-height: 1.03; letter-spacing: -2px; }
  h2 { margin: 16px 0 0; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 76px; color: #ff8a3d; direction: rtl; }
  p { margin: 30px 0 0; font-size: 38px; font-weight: 500; color: #8a6b4a; }
  .chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 40px; }
  .chip {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 28px; border-radius: 999px; font-size: 30px; font-weight: 600;
    background: #fff; border: 3px solid #ffe1b0; color: #6b5436;
  }
  .chip svg { width: 30px; height: 30px; stroke: #ff8a3d; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="stage">
    <div class="tiles">
      <div class="tile en">A</div>
      <div class="tile ar"><span>أ</span></div>
    </div>
    <div>
      <h1>Human, Animal,<br>Plant, Object</h1>
      <h2>إنسان، حيوان، نبات، جماد</h2>
      <p>One letter. Every category. Quickest wits win.</p>
      <div class="chips">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c1.6-3.4 4.5-5 8-5s6.4 1.6 8 5"/></svg>Human</span>
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M7 9.5a1.8 1.8 0 100-3.5 1.8 1.8 0 000 3.5zM17 9.5a1.8 1.8 0 100-3.5 1.8 1.8 0 000 3.5zM4.6 14.4a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2zM19.4 14.4a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2zM12 19.5c-2.6 0-4.2-1.3-4.2-3 0-1.9 1.9-3.6 4.2-3.6s4.2 1.7 4.2 3.6c0 1.7-1.6 3-4.2 3z"/></svg>Animal</span>
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 19c0-7 4.5-12 15-12 0 8-4.5 12-11 12H5zM8 16c2-3.5 4.5-5.5 8-6.5"/></svg>Plant</span>
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4.3 7.6L12 12l7.7-4.4M12 12v9"/></svg>Object</span>
      </div>
    </div>
  </div>
</body>
</html>
