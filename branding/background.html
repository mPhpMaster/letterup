<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Baloo+Bhaijaan+2:wght@800&display=block" rel="stylesheet">
<style>
  /* Discord Activity Background: 1024x576, art clustered at the edges so Discord's UI
     sits on clear space in the middle. */
  html, body { margin: 0; width: 1024px; height: 576px; overflow: hidden; background: #fff6e8; }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform: scale(0.533334); transform-origin: 0 0; overflow: hidden;
    background:
      radial-gradient(760px 540px at 0% 0%, rgba(255, 209, 102, 0.62), transparent 70%),
      radial-gradient(760px 540px at 100% 100%, rgba(255, 93, 143, 0.30), transparent 70%),
      radial-gradient(660px 460px at 100% 0%, rgba(6, 214, 160, 0.22), transparent 70%),
      radial-gradient(660px 460px at 0% 100%, rgba(255, 138, 61, 0.28), transparent 70%),
      #fff6e8;
  }
  .t {
    position: absolute; display: grid; place-items: center; border-radius: 26%;
    font-family: "Baloo 2", sans-serif; font-weight: 800; line-height: 1; color: #fff;
  }
  .ar { font-family: "Baloo Bhaijaan 2", sans-serif; }
  .pink { background: #ff5d8f; box-shadow: 0 16px 0 #d63f6d; }
  .orange { background: #ff8a3d; box-shadow: 0 16px 0 #d96f24; }
  .mint { background: #06d6a0; box-shadow: 0 16px 0 #04a97d; color: #023d2d; }
  .sun { background: #ffd166; box-shadow: 0 16px 0 #c99200; color: #3a1f00; }
  .plain { background: #fff; box-shadow: 0 16px 0 #ffe1b0; color: #c9a876; border: 4px solid #ffe1b0; }
</style>
</head>
<body>
  <div class="stage">
    <!-- top-left -->
    <div class="t pink" style="left:-30px;top:-20px;width:250px;height:250px;font-size:170px;transform:rotate(-11deg)">A</div>
    <div class="t orange ar" style="left:240px;top:70px;width:165px;height:165px;font-size:112px;transform:rotate(8deg)">ب</div>
    <div class="t plain" style="left:70px;top:290px;width:120px;height:120px;font-size:78px;transform:rotate(5deg)">K</div>
    <!-- top-right -->
    <div class="t mint" style="left:1660px;top:-10px;width:230px;height:230px;font-size:158px;transform:rotate(9deg)">M</div>
    <div class="t plain ar" style="left:1510px;top:130px;width:130px;height:130px;font-size:88px;transform:rotate(-7deg)">ن</div>
    <div class="t sun" style="left:1770px;top:280px;width:150px;height:150px;font-size:100px;transform:rotate(-13deg)">S</div>
    <!-- bottom-left -->
    <div class="t sun ar" style="left:-20px;top:830px;width:235px;height:235px;font-size:160px;transform:rotate(11deg)">ج</div>
    <div class="t pink" style="left:250px;top:905px;width:160px;height:160px;font-size:108px;transform:rotate(-6deg)">T</div>
    <div class="t plain" style="left:80px;top:665px;width:118px;height:118px;font-size:76px;transform:rotate(-9deg)">R</div>
    <!-- bottom-right -->
    <div class="t orange" style="left:1650px;top:810px;width:270px;height:270px;font-size:185px;transform:rotate(-8deg)">O</div>
    <div class="t mint ar" style="left:1480px;top:935px;width:150px;height:150px;font-size:100px;transform:rotate(10deg)">ح</div>
    <div class="t plain" style="left:1790px;top:660px;width:118px;height:118px;font-size:76px;transform:rotate(7deg)">P</div>
  </div>
</body>
</html>
