<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #13141c; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 28% 24%, rgba(123, 92, 255, 0.55), transparent 55%),
      radial-gradient(circle at 78% 82%, rgba(255, 201, 61, 0.28), transparent 50%),
      #13141c;
  }
  .tile {
    position: absolute; display: grid; place-items: center;
    border-radius: 22%; font-family: Rubik, sans-serif; font-weight: 900; line-height: 1;
  }
  .en {
    left: 180px; top: 190px; width: 480px; height: 480px;
    background: linear-gradient(160deg, #ffd766, #ffc93d); color: #221a00;
    font-size: 340px; transform: rotate(-8deg);
    box-shadow: 0 26px 0 #c99200, 0 60px 90px rgba(0, 0, 0, 0.55);
  }
  .ar {
    left: 480px; top: 440px; width: 370px; height: 370px;
    background: linear-gradient(160deg, #a08aff, #6843ff); color: #fff;
    font-size: 250px; transform: rotate(8deg);
    box-shadow: 0 22px 0 #4a2bd0, 0 50px 80px rgba(0, 0, 0, 0.55);
  }
  .ar span { transform: translateY(-18px); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="tile en">A</div>
  <div class="tile ar"><span>أ</span></div>
</body>
</html>
